# 1. Specifies which Kubernetes API group parses this file.
# 'apps/v1' => standard group for workloads like Deployments, DaemonSets, and StatefulSets.
apiVersion: apps/v1

# 2. Defines the exact type of object you want to create.
# A 'Deployment' : manages identical Pods, handles rolling updates, and automatically replaces failed Pods.
kind: Deployment

# 3. Contains metadata to name and tag this Deployment object within the cluster.
metadata:
  # The unique name for this Deployment object.
  name: triton-deployment
  # Labels are key-value metadata tags used for organization, logging, and filtering.
  # Here the key-value pair component-frontend/backend are arbitrarily set and could be anything else.
  labels:
    app: triton
    component: backend

# 4. The specification for the Deployment's behavior
spec:
  # Number of pods that we always want to be running
  replicas: 1

  # The "Selector" is how this Deployment finds and manages its Pods.
  # It tells the Deployment: "You are in charge of any Pod that has this exact tag."
  selector:
    matchLabels:
      app: triton

  # 5. The blueprint used to create every individual Pod.
  template:
    metadata:
      # Labels stamped onto every Pod created by this Deployment.
      # MUST match 'selector.matchLabels' above so the Deployment can track them.
      labels:
        app: triton
        component: backend

    # 6. The internal configuration of the Pod itself
    spec:
      # Forces the Pod to ONLY spawn on the nodes in our Triton Node Pool
      nodeSelector:
        cloud.google.com/gke-nodepool: triton-reserved-node-pool

      containers:
      # A list of containers to run inside this Pod (usually just one per Pod).
      - name: triton-container
        # Allocates a pseudo-TTY and keeps stdin open so we can connect to the terminal using 'kubectl attach'
        tty: true
        stdin: true

        # The exact Docker image URI pushed to Artifact Registry
        image: nvcr.io/nvidia/tritonserver:26.01-py3

        # Always repull the image
        imagePullPolicy: Always

        # The command used to start the Triton server inside the container
        command: ["tritonserver"]
        
        # Arguments passed to the command above. 
        # This points Triton directly to your Google Cloud Storage bucket where the models are saved.
        args:
        - "--model-repository=gs://machine-learning-ops-images-bucket-2026/served_models"

        # Opens ports so Kubernetes can route different types of traffic into Triton
        ports:
        # Used for standard REST API requests (e.g., simple JSON calls)
        - containerPort: 8000
          name: http
        
        # Used for high-performance, low-latency streaming requests
        - containerPort: 8001
          name: grpc
        
        # Used by Prometheus/Grafana to monitor GPU usage, memory, and inference statistics
        - containerPort: 8002
          name: metrics

        # Informs Kubernetes that this container requires exactly 1 NVIDIA GPU to function
        resources:
          limits:
            nvidia.com/gpu: 1

# --- Separates the Deployment block above from this Service block below ---
---
# 1. Core API group for networking resources
apiVersion: v1

# 2. We are creating a Service object
kind: Service

# 3. Metadata for the Service itself
metadata:
  name: triton-service
  labels:
    app: triton
    component: backend

# 4. The Service specification
spec:
  # Instructs Kubernetes to create an internal IP address (ClusterIP). 
  # This keeps Triton secure and saves costs by not creating a public internet IP.
  # Gradio can still perfectly route traffic to it internally.
  type: ClusterIP

  # 5. The Selector
  # The Service will continuously look for any Pods with this exact label to route traffic to
  selector:
    app: triton

  # 6. Port mappings
  ports:
    # HTTP Port mapping
  - name: http
    port: 8000
    targetPort: 8000

    # GRPC Port mapping (Gradio communicates with Triton via triton-service:8001)
  - name: grpc
    port: 8001
    targetPort: 8001

    # Metrics Port mapping
  - name: metrics
    port: 8002
    targetPort: 8002
